<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      background-color: #1a1a2e;
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #e94560;
      position: relative;
      z-index: 1000;
    }

    /* --- Left and right nav halves --- */
    nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    nav.right {
      justify-content: flex-end;
    }

    /* --- Logo in the center --- */
    .logo {
      flex-shrink: 0;
      margin: 0 20px;
    }

    .logo img {
      height: 45px;
      width: auto;
      display: block;
      transition: opacity 0.2s;
    }

    .logo img:hover {
      opacity: 0.85;
    }

    /* --- Nav items --- */
    .nav-item {
      position: relative;
    }

    .nav-item > a {
      color: #ccc;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 24px 0;
      white-space: nowrap;
    }

    .nav-item > a:hover {
      color: #e94560;
    }

    .nav-item > a.active {
      color: white;
      font-weight: bold;
    }

    /* Arrow for dropdowns */
    .nav-item.has-dropdown > a::after {
      content: '▾';
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .nav-item.has-dropdown:hover > a::after {
      transform: rotate(180deg);
    }

    /* --- Dropdown --- */
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #16213e;
      border: 1px solid #e94560;
      border-top: none;
      min-width: 180px;
      flex-direction: column;
    }

    /* Right-side dropdowns open to the left */
    nav.right .dropdown {
      left: auto;
      right: 0;
    }

    .nav-item:hover .dropdown {
      display: flex;
    }

    .dropdown a {
      color: #ccc;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      padding: 12px 18px;
      transition: background 0.2s, color 0.2s;
      border-bottom: 1px solid #1a1a2e;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background-color: #e94560;
      color: white;
    }

    /* --- Hamburger (mobile) --- */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      position: absolute;
      right: 40px;
    }

    .hamburger span {
      width: 25px;
      height: 2px;
      background-color: white;
      display: block;
    }

    @media (max-width: 700px) {
      .hamburger { display: flex; }

      header {
        justify-content: flex-start;
      }

      nav.left, nav.right {
        display: none;
        flex-direction: column;
        align-items: flex-start;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background-color: #1a1a2e;
        padding: 10px 40px 20px;
        gap: 0;
        border-bottom: 2px solid #e94560;
      }

      nav.left.open, nav.right.open {
        display: flex;
      }

      nav.right.open {
        top: auto;
      }

      .nav-item > a {
        padding: 12px 0;
        width: 100%;
      }

      .dropdown {
        position: static;
        border: none;
        border-left: 2px solid #e94560;
        margin-left: 15px;
        margin-bottom: 8px;
      }

      .nav-item.open .dropdown {
        display: flex;
      }

      .logo {
        margin: 0 15px;
      }

      .logo img {
        height: 36px;
      }
    }
  </style>
</head>
<body>

<header>

  <!-- LEFT NAV -->
  <nav class="left" id="nav-left">
    <div class="nav-item">
      <a href="/index.html" class="active">Home</a>
    </div>
    <div class="nav-item has-dropdown">
      <a href="#">About</a>
      <div class="dropdown">
        <a href="/pages/team.html">Our Team</a>
        <a href="/pages/mission.html">Mission</a>
      </div>
    </div>
  </nav>

  <!-- CENTER LOGO -->
  <a href="/index.html" class="logo">
    <img src="/static/logo.png" alt="Site Logo">
  </a>

  <!-- RIGHT NAV -->
  <nav class="right" id="nav-right">
    <div class="nav-item has-dropdown">
      <a href="#">Projects</a>
      <div class="dropdown">
        <a href="/pages/project1.html">Project One</a>
        <a href="/pages/project2.html">Project Two</a>
      </div>
    </div>
    <div class="nav-item">
      <a href="/pages/contact.html">Contact</a>
    </div>
  </nav>

  <!-- HAMBURGER (mobile only) -->
  <button class="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

</header>

<script>
  function toggleMenu() {
    document.getElementById('nav-left').classList.toggle('open');
    document.getElementById('nav-right').classList.toggle('open');
  }

  // Mobile: tap to toggle dropdowns
  document.querySelectorAll('.has-dropdown > a').forEach(link => {
    link.addEventListener('click', function(e) {
      if (window.innerWidth <= 700) {
        e.preventDefault();
        this.parentElement.classList.toggle('open');
      }
    });
  });
</script>

</body>
</html>
