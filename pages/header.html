<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      background-color: #1a1a2e;
      padding: 0 40px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e94560;
      position: relative;
      z-index: 1000;
    }

    .logo {
      color: white;
      font-size: 1.4rem;
      font-family: Georgia, serif;
      font-weight: bold;
      text-decoration: none;
    }

    .logo span {
      color: #e94560;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    /* --- Top-level nav items --- */
    .nav-item {
      position: relative;
    }

    .nav-item > a {
      color: #ccc;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 22px 0;
    }

    .nav-item > a:hover {
      color: #e94560;
    }

    .nav-item > a.active {
      color: white;
      font-weight: bold;
    }

    /* Arrow indicator for dropdowns */
    .nav-item.has-dropdown > a::after {
      content: '▾';
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .nav-item.has-dropdown:hover > a::after {
      transform: rotate(180deg);
    }

    /* --- Dropdown menu --- */
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #16213e;
      border: 1px solid #e94560;
      border-top: none;
      min-width: 180px;
      flex-direction: column;
    }

    .nav-item:hover .dropdown {
      display: flex;
    }

    .dropdown a {
      color: #ccc;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      padding: 12px 18px;
      transition: background 0.2s, color 0.2s;
      border-bottom: 1px solid #1a1a2e;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background-color: #e94560;
      color: white;
    }

    /* --- Hamburger (mobile) --- */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
    }

    .hamburger span {
      width: 25px;
      height: 2px;
      background-color: white;
      display: block;
    }

    @media (max-width: 600px) {
      .hamburger { display: flex; }

      nav {
        display: none;
        flex-direction: column;
        align-items: flex-start;
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background-color: #1a1a2e;
        padding: 20px 40px;
        gap: 0;
        border-bottom: 2px solid #e94560;
      }

      nav.open { display: flex; }

      .nav-item > a {
        padding: 12px 0;
        width: 100%;
      }

      .dropdown {
        position: static;
        border: none;
        border-left: 2px solid #e94560;
        margin-left: 15px;
        margin-bottom: 8px;
      }

      .nav-item:hover .dropdown,
      .nav-item.open .dropdown {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="/index.html" class="logo">My<span>Site</span></a>

    <button class="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <nav id="main-nav">

      <!-- Regular link (no dropdown) -->
      <div class="nav-item">
        <a href="/index.html" class="active">Home</a>
      </div>

      <!-- Dropdown example 1 -->
      <div class="nav-item has-dropdown">
        <a href="#">About</a>
        <div class="dropdown">
          <a href="/pages/team.html">Our Team</a>
          <a href="/pages/mission.html">Mission</a>
          <a href="/pages/history.html">History</a>
        </div>
      </div>

      <!-- Dropdown example 2 -->
      <div class="nav-item has-dropdown">
        <a href="#">Projects</a>
        <div class="dropdown">
          <a href="/pages/project1.html">Project One</a>
          <a href="/pages/project2.html">Project Two</a>
          <a href="/pages/project3.html">Project Three</a>
        </div>
      </div>

      <!-- Regular link (no dropdown) -->
      <div class="nav-item">
        <a href="/pages/contact.html">Contact</a>
      </div>

    </nav>
  </header>

  <script>
    function toggleMenu() {
      document.getElementById('main-nav').classList.toggle('open');
    }

    // Mobile: tap to open dropdown instead of hover
    document.querySelectorAll('.has-dropdown > a').forEach(link => {
      link.addEventListener('click', function(e) {
        if (window.innerWidth <= 600) {
          e.preventDefault();
          this.parentElement.classList.toggle('open');
             }
      });
    });
  </script>

</body>
</html>
