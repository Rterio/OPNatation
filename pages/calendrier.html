<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNatation</title>
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    main {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
<div id="header"></div>
<script>
  fetch('/OPNatation/pages/header.html')
    .then(r => r.text())
    .then(html => {
      const headerEl = document.getElementById('header');
      headerEl.innerHTML = html;

      // innerHTML doesn't run <script> tags automatically — re-create
      // them so they actually execute.
      headerEl.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    });
</script>

  <!-- Page content -->
  <main>
    <h1>Hello, World!</h1>
    <p>My local server is working.</p>
  </main>

  <!-- Footer -->
  <div id="footer"></div>
  <script>
    fetch('/OPNatation/pages/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

</body>
</html>
