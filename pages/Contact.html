<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNatation — Contact</title>
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      background-color: #f8fafc; /* Matches your premium boutique grey backdrop */
    }

    .contact-wrapper {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e; /* Exact brand dark navy */
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.95rem;
      text-align: center;
    }

    .contact-form {
      background: white;
      padding: 40px;
      border-radius: 16px; /* Smooth rounded corners matching your layouts */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Softer shadows matching premium cards */
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #1a1a2e; /* Matches brand typography standard codes */
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e5e7eb; /* Soft structural grey line borders */
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    /* Fixed: Now utilizes your brand blue (#1a56db) focus indicators */
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
      background-color: white;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* Fixed: Buttons match the brand call-to-actions */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #1a56db; /* Primary brand action blue color token */
      color: white;
      border: none;
      border-radius: 99px; /* Smooth pill button design matching Inscriptions */
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #1546b5; /* Deeper hover tone override */
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Info sections below form fields */
    .contact-info {
      margin-top: 30px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .info-card {
      flex: 1;
      min-width: 160px;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .info-card .icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .info-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .info-card p, .info-card a {
      font-size: 0.9rem;
      color: #1a1a2e;
      text-decoration: none;
      word-break: break-word; /* Prevents overflow issues from long email chains */
    }
