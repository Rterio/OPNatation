<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNatation</title>
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    main {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header"></div>
  <script>
    fetch('/OPNatation/pages/header.html')
      .then(r => r.text())
      .then(html => document.getElementById('header').innerHTML = html);
  </script>

  <!-- Page content -->
  <main>
    <h1>Hello World</h1>
    <p>My local server is working.</p>
  </main>

  <!-- Footer -->
  <div id="footer"></div>
  <script>
    fetch('/OPNatation/pages/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

</body>
</html>
