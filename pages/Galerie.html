<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie - OPNatation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .gallery-container {
      max-width: 1200px;
      width: 100%;
      margin: 40px auto;
      padding: 0 40px;
      flex: 1; /* Pushes the footer down cleanly if the screen is tall */
    }

    .gallery-title {
      font-family: Arial, sans-serif;
      color: #1a1a2e;
      font-size: 2rem;
      margin-bottom: 30px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Outer boundaries for your custom live slider widget */
    .gallery-wrapper {
      position: relative;
      width: 100%;
      max-width: 1000px; /* Clamps the width so the slideshow stays razor sharp */
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      background-color: #1a1a2e;
    }

    /* Force the Flickr native layout to fill the container wrapper perfectly */
    .gallery-wrapper iframe, 
    .gallery-wrapper .flickr-embed {
      display: block !important;
      width: 100% !important;
      border: none !important;
    }

    @media (max-width: 700px) {
      .gallery-container {
        padding: 0 20px;
        margin: 25px auto;
      }
      .gallery-title {
        font-size: 1.6rem;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <div id="header"></div>

  <div class="gallery-container">
    <h1 class="gallery-title">Nos moments forts</h1>
    
    <div class="gallery-wrapper">
      <a data-flickr-embed="true" href="https://www.flickr.com/photos/204677686@N06/albums/72177720334054802" title="Test OP">
        <img src="https://live.staticflickr.com/65535/55317097947_72fe3d024e_h.jpg" width="1600" height="1200" alt="Test OP"/>
      </a>
      <script async src="//embedr.flickr.com/assets/client-code.js" charset="utf-8"></script>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    // Component Loader Engine for Header & Footer
    fetch('/OPNatation/pages/header.html?v=' + Date.now())
      .then(r => r.text())
      .then(h => document.getElementById('header').innerHTML = h);

    fetch('/OPNatation/pages/footer.html')
      .then(r => r.text())
      .then(h => document.getElementById('footer').innerHTML = h);
  </script>
</body>
</html>
